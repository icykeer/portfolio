
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icyke Manzano | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f2937;
        }

        header h2 {
            color: #a78bfa;
        }

        .hero {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #cbd5e1;
        }

        .portfolio {
            width: 90%;
            max-width: 1100px;
            margin: 20px auto 50px;
            background: #1f2937;
            padding: 15px;
            border-radius: 15px;
        }

        iframe {
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 10px;
            background: white;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <header>
        <h2>ICYKE.</h2>
        <span>My Portfolio</span>
    </header>

    <section class="hero">
        <h1>Hi, I'm Icyke Manzano</h1>
        <p>Information Technology Student | Aspiring Developer</p>
        <p>Welcome to my personal portfolio.</p>
    </section>

    <section class="portfolio">
        <iframe
            src="Icyke%20Manzano%20Portfolio%20(3).pdf">
        </iframe>
    </section>

    <footer>
        © 2026 Icyke Manzano. All Rights Reserved.
    </footer>

</body>
</html>
